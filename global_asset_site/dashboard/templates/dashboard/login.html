{% extends "dashboard/base.html" %}
{% block title %}Sign in · Global Asset Management{% endblock %}
{% block body %}
<div class="login-wrap">
  
<div class="login-card">
    
<h1>Global Asset Mgmt</h1>
    
<p class="sub">Demo sign-in: enter any valid email address. No password needed.</p>
    
{% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
    
<form method="post">
      
{% csrf_token %}
      
<input type="hidden" name="next" value="{{ next }}">
      
<label for="email">Email address</label>
      
<input id="email" name="email" type="text" autocomplete="email" placeholder="name@example.com"
             
{% if locked %}disabled{% else %}autofocus{% endif %}>
      
<button class="btn" type="submit" {% if locked %}disabled{% endif %}>Sign in</button>
    
</form>
  
</div>
</div>
{% endblock %}
